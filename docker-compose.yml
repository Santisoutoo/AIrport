version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: airport_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - airport_network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: airport_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airport
      POSTGRES_USER: airport_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - airport_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport_user -d airport"]
      interval: 30s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7-alpine
    container_name: airport_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: 1234
      DOCKER_INFLUXDB_INIT_ORG: airport
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - airport_network

  # ============================================
  # Application Microservices
  # ============================================

  flight_plan_service:
    build:
      context: ./services/flight_plan_service
      dockerfile: Dockerfile
    container_name: airport_flight_plan
    restart: unless-stopped
    ports:
      - "8003:8000"
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/flight-plan/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  airport_network:
    driver: bridge
    name: airport_network

volumes:
  redis_data:
    name: airport_redis_data
  postgres_data:
    name: airport_postgres_data
  influxdb_data:
    name: airport_influxdb_data