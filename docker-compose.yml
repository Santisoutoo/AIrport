version: '3.8'

services:
  mqtt_broker:
    image: eclipse-mosquitto:2.0
    container_name: airport_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT port
      - "9001:9001"      # WebSocket port
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  airport_network:
    driver: bridge
    name: airport_network

volumes:
  mosquitto_data:
    name: airport_mqtt_data
  mosquitto_logs:
    name: airport_mqtt_logs