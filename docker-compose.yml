version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: airport_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - airport_network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: airport_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - airport_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7-alpine
    container_name: airport_influxdb
    restart: unless-stopped
    ports:
      - "8087:8086"
    env_file:
      - .env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${POSTGRES_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - airport_network

  # ============================================
  # Application Microservices
  # ============================================

  flight_plan_service:
    build:
      context: ./services/flight_plan_service
      dockerfile: Dockerfile
    container_name: airport_flight_plan
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/flight-plan/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  weather_service:
    build:
      context: ./services/weather_service
      dockerfile: Dockerfile
    container_name: airport_weather
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/weather/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  asr_service:
    build:
      context: ./services/asr_service
      dockerfile: Dockerfile
    container_name: airport_asr
    restart: unless-stopped
    ports:
      - "8006:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - asr_hf_cache:/root/.cache/huggingface
      - ./services/asr_service:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/asr/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  controller_hmi_service:
    build:
      context: ./services/controller_hmi_service
      dockerfile: Dockerfile
    container_name: airport_controller_hmi
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
    volumes:
      - ./services/controller_hmi_service/static:/app/static
      - ./services/controller_hmi_service/api:/app/api
      - ./data/scripts:/app/data_scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flight_plan_service:
        condition: service_healthy
      weather_service:
        condition: service_healthy
    networks:
      - airport_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/hmi/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  airport_network:
    driver: bridge
    name: airport_network

volumes:
  redis_data:
    name: airport_redis_data
  postgres_data:
    name: airport_postgres_data
  influxdb_data:
    name: airport_influxdb_data
  asr_hf_cache:
    name: airport_asr_hf_cache
