name: OpenWiki Docs Update

# Manual only (no cron): run it yourself from the Actions tab so it never spends
# subscription quota on its own.
on:
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so the agent can git diff since the last run

      - name: Run Claude doc agent
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token from `claude setup-token` (Pro/Max). Uses your subscription quota,
          # not a metered API key. Store it as the repo secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow the instructions in .claude/agents/openwiki-writer.md to refresh the
            documentation under openwiki/ from the latest code changes. If openwiki/.last-update.json
            exists, do an incremental update (git diff last_commit..HEAD); otherwise do a full
            generation. Update openwiki/.last-update.json and the openwiki pointer sections in
            CLAUDE.md and AGENTS.md. Leave all changes in the working tree; do NOT commit or push.
          claude_args: "--model claude-sonnet-5 --allowedTools Read,Grep,Glob,Write,Edit,Bash"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: openwiki/update
          commit-message: "docs: update openwiki"
          title: "docs: update openwiki"
          body: "Automated documentation refresh generated by the openwiki-writer agent (Claude Code, Sonnet)."
          add-paths: |
            openwiki/**
            CLAUDE.md
            AGENTS.md
