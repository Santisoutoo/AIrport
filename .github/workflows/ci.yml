name: CI

on:
  push:
    branches: [ main, dev, test ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Minimal dependency set: only what the test suite imports at collection
      # and run time. The heavy base deps in pyproject.toml (transformers,
      # jupyter, matplotlib, folium, xplane-airports, jiwer) are intentionally
      # NOT installed — the taxi-router graph fixture is committed as JSON, so
      # xplane-airports is not needed to build it here.
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8" "pytest-asyncio>=0.23" "pytest-mock>=3.12" \
            "pytest-cov>=5" "respx>=0.20" "fastapi>=0.110" \
            "sqlalchemy>=2.0" httpx requests redis pydantic networkx psycopg2-binary

      # No --cov-fail-under override here: `fail_under` in pyproject.toml is
      # the single source of truth for the gate. It sits two points below the
      # measured baseline and is raised in follow-up PRs towards 70% of the
      # full scope — see issue #47.
      - name: Run test suite
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.14,<0.15"

      # Advisory until the repo-wide `ruff check --fix` + `ruff format` pass
      # lands — see issue #48. Violations still show up as annotations on the
      # diff; they just don't fail the build yet. Drop both
      # continue-on-error lines in that same commit to start blocking.
      - name: Lint
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Format check
        continue-on-error: true
        run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/controller_hmi_service/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/controller_hmi_service/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
