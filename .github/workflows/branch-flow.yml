name: Branch flow

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  enforce-dev-flow:
    runs-on: ubuntu-latest
    steps:
      - name: PRs to main must come from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs to 'main' must come from 'dev' (got '$HEAD_REF'). Merge into 'dev' first, then open a PR dev -> main."
            exit 1
          fi
          echo "OK: PR comes from 'dev'."
