[project]
name = "airport-atc-simulator"
version = "0.1.0"
description = "AI-powered Air Traffic Control training platform with X-Plane 12 integration"
readme = "README.md"
requires-python = "~=3.11.0"
license = "MIT"
authors = [
    {name = "Santiago Souto Ortega", email = "soutoortegasantiago@gmail.com"}
]
keywords = [
    "aviation",
    "atc",
    "air-traffic-control",
    "x-plane",
    "flight-simulator",
    "ai",
    "training",
    "airports"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# Default install (`uv sync`): the runtime the backend actually needs to run
# the services and the test suite locally. Research/notebook packages live in
# the `analysis` extra and are NOT installed by default.
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3",
    "httpx>=0.26,<1.0",
    "python-dotenv>=1.0",
    "redis>=5.0,<7",
    "networkx>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/Santisoutoo/AIrport"
Repository = "https://github.com/Santisoutoo/AIrport"
Issues = "https://github.com/Santisoutoo/AIrport/issues"
Documentation = "https://github.com/Santisoutoo/AIrport/wiki"

# ---------------------------------------------------------------------------
# Dependency extras — single source of truth for every deployable unit.
#
# The per-service `requirements.txt` files that the Dockerfiles install are
# GENERATED from these extras by `scripts/sync_requirements.py`; never edit
# them by hand. Each service image installs `service-core` plus its own extra
# (see SERVICES in that script), so the extras below list only the delta on
# top of the shared FastAPI stack.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# Shared FastAPI stack baked into every service image.
service-core = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3",
]

# Cloud Run pilot agents (agents/del, agents/gnd, agents/twr).
agents = [
    "google-adk>=1.0",
]

orchestrator = [
    "httpx>=0.26,<1.0",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<7",
    "networkx>=3.0,<4",
    "google-adk>=1.0",
]

asr = [
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "rapidfuzz>=3.0",
    "google-genai>=1.0",
]

arrival-simulator = [
    "redis>=5.0,<7",
    "httpx>=0.26,<1.0",
]

flight-plan = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "httpx>=0.26,<1.0",
]

weather = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "httpx>=0.26,<1.0",
]

pilots-communication = [
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.26,<1.0",
]

controller-hmi = [
    "httpx>=0.26,<1.0",
    "requests>=2.31,<3",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<7",
    "folium>=0.15",
    "xplane-airports>=4.0",
]

# Notebooks, plots and ASR benchmarking under data/ and agents_evaluation/.
# Deliberately out of the default install: heavy and not needed to run or test
# the backend.
analysis = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "folium>=0.15",
    "xplane-airports>=4.0",
    "transformers>=4.40",
    "jiwer>=3.0",
]

test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "respx>=0.20",
    # `agents_evaluation/evaluate_wer.py` imports it at module level, so the
    # unit tests for that script cannot collect without it.
    "jiwer>=3.0",
]

# Tooling installed for development only; never shipped in a service image.
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["xplane_plugin*"]

# ---------------------------------------------------------------------------
# Ruff — deliberately lax first pass (issue #48).
#
# The goal is a signal, not a wall. The repo-wide `ruff format` + `ruff check
# --fix` sweep that this config was written for has now landed, taking the
# findings from 303 to 32, and the scoped ignores below take that to 6. The CI
# lint job is still non-blocking: the last 6 findings are left deliberately
# visible because fixing them means renaming variables rather than reformatting
# them, and flipping the job to blocking is a follow-up.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "data",
    "logs",
    "output",
    "transcription",
]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I). Nothing opinionated yet;
# UP/B/SIM come later, one rule family per PR.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: names are imported to be part of the public API.
"**/__init__.py" = ["F401"]
# The X-Plane plugins run inside the simulator's own interpreter and must
# patch sys.path before importing anything from the repo.
"plugins/**" = ["E402"]
"xplane_plugin/**" = ["E402"]
# pytest fixtures shadow their own names; conftest patches sys.path too.
"tests/**" = ["E402", "F811"]
"**/conftest.py" = ["E402"]
# Same bootstrap-before-import pattern as the plugins: main.py loads the .env
# into os.environ and routes.py pushes data/scripts onto sys.path, both of
# which have to happen before the imports that depend on them.
"services/controller_hmi_service/main.py" = ["E402"]
"services/controller_hmi_service/api/routes.py" = ["E402"]
# LLM prompt modules: every over-long line is natural-language text inside a
# triple-quoted prompt. Wrapping it would change the prompt the model is sent,
# so E501 is not actionable here.
"agents/*/agent/prompts/*.py" = ["E501"]
"services/orchestrator_service/agent/prompts.py" = ["E501"]
"agents_evaluation/judge_responses.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "plugins", "xplane_plugin"]

# ---------------------------------------------------------------------------
# Mypy — gradual adoption, package by package (issue #50).
#
# The global settings are lax so type checking never blocks work on modules
# that have not been annotated yet. Strictness is opted into per package with
# an override block; `shared/` is the first one because it has the highest
# fan-in. To add a package, append its module pattern to the strict override
# below and to the `mypy` invocation in the CI type-check job.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Third-party packages here ship no stubs (google-adk, xplane-airports,
# faster-whisper, ...); do not fail on that.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true
pretty = true
warn_redundant_casts = true

# Strict for shared/ only.
[[tool.mypy.overrides]]
module = ["shared.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = [".", "services/orchestrator_service", "services/arrival_simulator_service"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: integration pipelines (may take >1s)",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
# Only modules that the test battery is intended to cover. Other modules
# (aircraft_mover FSM, debrief endpoint, shared/services/aircraft_*) are
# tracked but excluded from the fail_under threshold since they are out of
# scope for the current phase — see memoria 5.3.3 for the deferred items.
source = [
    "services/orchestrator_service/agent",
    "services/orchestrator_service/api",
    "services/orchestrator_service/db",
    "services/orchestrator_service/frequency_audit.py",
    "services/orchestrator_service/runner.py",
    "services/orchestrator_service/session_log.py",
    "services/orchestrator_service/debrief_builder.py",
    "services/orchestrator_service/config.py",
    "services/arrival_simulator_service/core/event_bridge.py",
    "services/arrival_simulator_service/core/arrival_planner.py",
    "services/arrival_simulator_service/core/runway_config.py",
    "services/arrival_simulator_service/core/phases.py",
    "services/arrival_simulator_service/core/geo.py",
    "shared/services/taxi_router",
]
omit = [
    "*/__pycache__/*",
    "*/main.py",
    "*/agent/agent.py",
    "*/agent/prompts.py",
    "*/agent/debrief_agent.py",
    "*/agent/debrief_prompt.py",
    "*/agent/tools/confirm.py",
    "*/api/aircraft.py",
    "*/api/clearances.py",
    "*/api/debrief.py",
    "*/api/flight_plans.py",
    "*/api/weather.py",
    "*/shared/callbacks.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Real gate, enforced in CI (issue #47). Measured baseline on the branch point
# for this change: 86.29% (773 statements, 106 missed). The threshold is
# baseline - 2, rounded down, as a buffer against line-count noise; raise it in
# follow-up PRs as coverage grows.
fail_under = 84
