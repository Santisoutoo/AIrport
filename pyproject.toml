[project]
name = "AIrport-atc-simulator"
version = "0.1.0"
description = "AI-powered Air Traffic Control training platform with X-Plane 12 integration"
readme = "README.md"
requires-python = "~=3.11.0"
license = "MIT"
authors = [
    {name = "Santiago Souto Ortega", email = "soutoortegasantiago@gmail.com"}
]
keywords = [
    "aviation",
    "atc",
    "air-traffic-control",
    "x-plane",
    "flight-simulator",
    "ai",
    "training",
    "airports"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "xplane-airports",
    "folium",
    "networkx",
    "matplotlib",
    "jupyter",
    "redis",
    "ipykernel",
    "psycopg2-binary",
    "transformers",
    "jiwer",
    "httpx",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/airport-sim/airport-atc-simulator"
Repository = "https://github.com/airport-sim/airport-atc-simulator"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "respx>=0.20",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
]
dev = [
    "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
include = ["xplane_plugin*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb", "data", "output", "logs", "wiki"]

[tool.ruff.lint]
# Ruff's default E subset. E501 (line length) is deliberately left out: ~40
# files exceed 100 characters and `ruff format` cannot break long strings or
# comments, so selecting it would mean hand-reflowing with no autofix behind
# it. Add it once the formatting pass has landed.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]     # re-exports are the point of these files
"tests/**" = ["E402"]           # sys.path setup has to precede project imports
"plugins/**" = ["E402"]         # XPPython3 plugins import after the path hack
"xplane_plugin/**" = ["E402"]
# _load_env_file() must populate os.environ before FastAPI and the service
# modules are imported, and routes.py extends sys.path the same way.
"services/controller_hmi_service/main.py" = ["E402"]
"services/controller_hmi_service/api/routes.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are function calls by design, so
# B008 would fire on every endpoint signature in the repo.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["services", "shared", "tests", "xplane_plugin"]

[tool.pytest.ini_options]
pythonpath = [".", "services/orchestrator_service", "services/arrival_simulator_service"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: integration pipelines (may take >1s)",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
# Only modules that the test battery is intended to cover. Other modules
# (aircraft_mover FSM, debrief endpoint, shared/services/aircraft_*) are
# tracked but excluded from the fail_under threshold since they are out of
# scope for the current phase — see memoria 5.3.3 for the deferred items.
#
# `source` must list packages or DIRECTORIES only. Single .py file paths are
# not valid entries: coverage treats them as module names, warns
# "Module ... was never imported", and silently drops them from the report —
# which is what used to happen to debrief_builder, runner, session_log,
# frequency_audit, config, event_bridge, arrival_planner, runway_config,
# phases and geo. Scope is therefore expressed as directories here and
# narrowed in `omit` below.
source = [
    "services/orchestrator_service",
    "services/arrival_simulator_service/core",
    "services/weather_service/core",
    "shared/services",
    "shared/models",
]
omit = [
    "*/__pycache__/*",
    "*/main.py",
    "*/agent/agent.py",
    "*/agent/prompts.py",
    "*/agent/debrief_agent.py",
    "*/agent/debrief_prompt.py",
    "*/api/aircraft.py",
    "*/api/clearances.py",
    "*/api/debrief.py",
    "*/api/flight_plans.py",
    "*/api/weather.py",
    "*/shared/callbacks.py",
    # Pulled in by the directory-level `source` entries above but out of scope
    # for this phase: no test battery covers them yet. Several are also
    # deletion candidates under issue #46.
    "*/arrival_simulator_service/core/plan_catalog.py",
    "*/arrival_simulator_service/core/scheduler.py",
    "*/weather_service/core/database/*",
    "*/weather_service/core/metar_taf_fetcher.py",
    "*/shared/services/aircraft_state_store.py",
    "*/shared/services/aircraft_tracker.py",
    "*/shared/services/airport_data_store.py",
    "*/shared/services/stand_assigner.py",
    "*/shared/models/aircraft.py",
    "*/shared/models/aircraft_state.py",
    "*/shared/models/airport.py",
    "*/shared/models/command_parser.py",
    "*/shared/models/communications.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# The gate sits two points below the measured baseline to absorb line-count
# noise, and is raised whenever a PR lifts coverage. History:
#   77 — 78.89% over 1364 statements, `source` scope corrected (#47, PR #80)
#   79 — 81.81% over 1523 statements, weather_service covered (#49)
# The old 70% target was set against the broken scope and is already cleared.
fail_under = 79
