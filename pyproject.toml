[project]
name = "airport-atc-simulator"
version = "0.1.0"
description = "AI-powered Air Traffic Control training platform with X-Plane 12 integration"
readme = "README.md"
requires-python = "~=3.11.0"
license = "MIT"
authors = [
    {name = "Santiago Souto Ortega", email = "soutoortegasantiago@gmail.com"}
]
keywords = [
    "aviation",
    "atc",
    "air-traffic-control",
    "x-plane",
    "flight-simulator",
    "ai",
    "training",
    "airports"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# Default install (`uv sync`): the runtime the backend actually needs to run
# the services and the test suite locally. Research/notebook packages live in
# the `analysis` extra and are NOT installed by default.
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3",
    "httpx>=0.26,<1.0",
    "python-dotenv>=1.0",
    "redis>=5.0,<7",
    "networkx>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/Santisoutoo/AIrport"
Repository = "https://github.com/Santisoutoo/AIrport"
Issues = "https://github.com/Santisoutoo/AIrport/issues"
Documentation = "https://github.com/Santisoutoo/AIrport/wiki"

# ---------------------------------------------------------------------------
# Dependency extras — single source of truth for every deployable unit.
#
# The per-service `requirements.txt` files that the Dockerfiles install are
# GENERATED from these extras by `scripts/sync_requirements.py`; never edit
# them by hand. Each service image installs `service-core` plus its own extra
# (see SERVICES in that script), so the extras below list only the delta on
# top of the shared FastAPI stack.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# Shared FastAPI stack baked into every service image.
service-core = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3",
]

# Cloud Run pilot agents (agents/del, agents/gnd, agents/twr).
agents = [
    "google-adk>=1.0",
]

orchestrator = [
    "httpx>=0.26,<1.0",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<7",
    "networkx>=3.0,<4",
    "google-adk>=1.0",
]

asr = [
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "rapidfuzz>=3.0",
    "google-genai>=1.0",
]

arrival-simulator = [
    "redis>=5.0,<7",
    "httpx>=0.26,<1.0",
]

flight-plan = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "httpx>=0.26,<1.0",
]

weather = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "httpx>=0.26,<1.0",
]

pilots-communication = [
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.26,<1.0",
]

controller-hmi = [
    "httpx>=0.26,<1.0",
    "requests>=2.31,<3",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<7",
    "folium>=0.15",
    "xplane-airports>=4.0",
]

# Notebooks, plots and ASR benchmarking under data/ and agents_evaluation/.
# Deliberately out of the default install: heavy and not needed to run or test
# the backend.
analysis = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "folium>=0.15",
    "xplane-airports>=4.0",
    "transformers>=4.40",
    "jiwer>=3.0",
]

test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "respx>=0.20",
    # `agents_evaluation/evaluate_wer.py` imports it at module level, so the
    # unit tests for that script cannot collect without it.
    "jiwer>=3.0",
]

# Tooling installed for development only; never shipped in a service image.
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["xplane_plugin*"]

# ---------------------------------------------------------------------------
# Ruff — deliberately lax first pass (issue #48).
#
# The goal is a signal, not a wall: the CI lint job is non-blocking and the
# repo has NOT been reformatted yet. A repo-wide `ruff format` + `ruff check
# --fix` lands as its own PR once the branches currently in flight are merged,
# so the diff does not collide with them.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "data",
    "logs",
    "output",
    "transcription",
]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I). Nothing opinionated yet;
# UP/B/SIM come later, one rule family per PR.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: names are imported to be part of the public API.
"**/__init__.py" = ["F401"]
# The X-Plane plugins run inside the simulator's own interpreter and must
# patch sys.path before importing anything from the repo.
"plugins/**" = ["E402"]
"xplane_plugin/**" = ["E402"]
# pytest fixtures shadow their own names; conftest patches sys.path too.
"tests/**" = ["E402", "F811"]
"**/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "plugins", "xplane_plugin"]

# ---------------------------------------------------------------------------
# Mypy — gradual adoption, package by package (issue #50).
#
# The global settings are lax so type checking never blocks work on modules
# that have not been annotated yet. Strictness is opted into per package with
# an override block; `shared/` is the first one because it has the highest
# fan-in. To add a package, append its module pattern to the strict override
# below and to the `mypy` invocation in the CI type-check job.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Third-party packages here ship no stubs (google-adk, xplane-airports,
# faster-whisper, ...); do not fail on that.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true
pretty = true
warn_redundant_casts = true

# Strict for shared/ only.
[[tool.mypy.overrides]]
module = ["shared.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = [".", "services/orchestrator_service", "services/arrival_simulator_service"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: integration pipelines (may take >1s)",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
# The three units the test battery is written against: the orchestrator
# service, the arrival simulator's core, and the shared taxi router.
#
# ONLY DIRECTORIES BELONG HERE — never individual .py paths. coverage.py
# resolves every `source` entry as an importable package/module name or as a
# directory; a bare file path matches neither, so it is dropped with a
# `module-not-imported` CoverageWarning and silently vanishes from the
# denominator. That is exactly what used to happen: ten of the fourteen
# entries here were file paths, so the reported total was measured over the
# four directory entries alone. Two of those paths (core/phases.py,
# core/geo.py) did not even exist any more and nobody noticed.
#
# Directory entries also fix the `runner.py` blind spot: tests import it as a
# bare top-level module (`import runner`, via the sys.path entry that
# tests/conftest.py installs), so no module-name-based rule could ever match
# it. A directory entry matches on the file's path instead, which is stable
# regardless of how the module was imported.
#
# DELIBERATELY OUT OF THE GATE (untested or not importable under pytest):
#   xplane_plugin/          runs inside X-Plane's embedded interpreter; never
#                           imported by the suite, so it would enter at 0%
#   agents/{del,gnd,twr}/   Cloud Run agent images, no test modules
#   services/flight_plan_service, controller_hmi_service, pilots_communication
#                           no test modules
# Genuinely exercised but not gated yet (widen in a follow-up, deliberately —
# measured on this branch): services/weather_service 83.6%, plugins/GND 45.0%,
# services/asr_service/core 75.1%, agents/common 100%.
source = [
    "services/orchestrator_service",
    "services/arrival_simulator_service/core",
    "shared/services/taxi_router",
]
omit = [
    "*/__pycache__/*",
    "*/main.py",
    "*/agent/agent.py",
    "*/agent/prompts.py",
    "*/agent/debrief_agent.py",
    "*/agent/debrief_prompt.py",
    "*/agent/tools/confirm.py",
    "*/api/aircraft.py",
    "*/api/clearances.py",
    "*/api/debrief.py",
    "*/api/flight_plans.py",
    "*/api/weather.py",
    "*/shared/callbacks.py",
    "tests/*",
]

[tool.coverage.report]
# Guard against a second flavour of the silent-omission bug above: when
# scanning a `source` directory for files that were never imported, coverage
# skips any subdirectory without an __init__.py. A new subpackage added
# without one would quietly leave the denominator. No-op today (every
# subdirectory in scope has an __init__.py) — it is here so it stays that way.
include_namespace_packages = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Real gate, enforced in CI (issue #47). Re-baselined on the corrected
# `source` above: 86.05% (1541 statements, 215 missed). The previous baseline
# (91.71%) was measured over 808 statements because ten `source` entries were
# being dropped — the new figure is lower over nearly twice the surface, and
# the difference is a measurement correction, not a coverage regression.
# Threshold is baseline - 2, rounded down, as a buffer against line-count
# noise; raise it in follow-up PRs as coverage grows.
fail_under = 84
