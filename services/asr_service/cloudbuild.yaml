steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'europe-west1-docker.pkg.dev/airport-490118/airport/asr-service:latest'
      - '--build-arg'
      - 'ASR_HF_MODEL=jacktol/whisper-medium.en-fine-tuned-for-ATC-faster-whisper'
      - '.'

images:
  - 'europe-west1-docker.pkg.dev/airport-490118/airport/asr-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 20

timeout: '1800s'
